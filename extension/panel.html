<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fff;
    }
    header {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; background: #0f172a; color: #fff;
    }
    #title { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button {
      border: 0; background: rgba(255,255,255,.12); color: #fff; cursor: pointer;
      width: 26px; height: 26px; border-radius: 6px; font-size: 13px; line-height: 1;
    }
    button:hover { background: rgba(255,255,255,.25); }
    /* min-height:0 — a replaced element won't shrink below its intrinsic
       150px height without it, which overflows a launcher-sized overlay. */
    iframe { flex: 1; border: 0; width: 100%; height: 100%; min-height: 0; background: transparent; }
    #err {
      display: none; padding: 24px; color: #64748b; font-size: 13px; line-height: 1.6;
    }

    /* Clear + phone: the wrapper itself paints nothing, so the customer's site
       (clear) or the device screen (phone) shows through. The window controls
       float over the content in their own translucent pill instead of a bar. */
    body.chromeless { background: transparent; }
    body.chromeless header {
      position: absolute; top: 10px; right: 10px; z-index: 5;
      padding: 4px; gap: 4px; background: rgba(15,23,42,.55);
      border-radius: 10px; backdrop-filter: blur(8px);
      opacity: 0; transition: opacity .18s ease;
    }
    body.chromeless:hover header, body.chromeless header:focus-within { opacity: 1; }
    body.chromeless #title { display: none; }
    body.chromeless button { width: 24px; height: 24px; font-size: 12px; }
    /* Phone: the frame already insets us below the island, so the controls
       sit at the top of the screen area like any other chromeless panel. */
    /* Overlay: the demo draws everything, including its own close button —
       we contribute no chrome at all. */
    body.style-overlay header { display: none; }
    body.chromeless #err {
      background: rgba(255,255,255,.94); border-radius: 14px; margin: 16px;
      box-shadow: 0 8px 30px rgba(15,23,42,.2);
    }
  </style>
</head>
<body>
  <header>
    <div id="title">Demo Experience</div>
    <button id="min" title="Minimize">–</button>
    <button id="full" title="Full screen">⛶</button>
    <button id="close" title="Close">✕</button>
  </header>
  <iframe id="demo" allow="microphone; autoplay; clipboard-write"></iframe>
  <div id="err"><b>Cognigy Demo Studio isn't running.</b><br />Start the Demo Studio app, then close and reopen this panel.</div>
  <script src="panel.js"></script>
</body>
</html>
