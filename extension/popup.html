<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    /* Extension pages are their own documents and cannot read the dashboard's
       style.css, so the palette is duplicated here. Keep it in step with the
       tier-1 block in apps/studio/renderer/style.css — that file is the
       reference. Plain rgba only: MV3's floor is Chrome 88 and color-mix()
       needs 111+. */
    :root {
      --nice-ink: #21212b;
      --nice-blue: #3694fc;
      --nice-teal: #36ead0;
      --nice-pink: #ff5c8a;
      --surface: #fff;
      --surface-2: #fafbfc;
      --surface-3: #f4f6f9;
      --ink: #16161d;
      --soft: #64748b;
      --faint: #94a3b8;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --on-dark: #fff;
      --primary-soft: rgba(54,148,252,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { width: 300px; background: var(--surface); color: var(--ink); }
    h1 {
      font-size: 12px; display: flex; align-items: center; gap: 9px;
      background: var(--nice-ink); color: var(--on-dark); padding: 12px 14px; font-weight: 500;
    }
    /* Official lockup, referenced not inlined — see brand/README.txt in the
       renderer folder for why. */
    h1 .brand {
      width: 104px; height: 17px; flex: 0 0 auto;
      background: url("brand/cognigy-white-and-blue.svg") left center / contain no-repeat;
    }
    h1 .sub { letter-spacing: .12em; text-transform: uppercase; font-size: 9.5px; opacity: .62; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--soft); margin-left: auto; }
    .dot.on { background: var(--nice-teal); }
    .dot.off { background: var(--nice-pink); }
    .wrap { padding: 12px 14px 14px; }

    /* master switch */
    .master {
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--surface-2); margin-bottom: 12px;
    }
    .master.on { background: var(--primary-soft); border-color: var(--nice-blue); }
    .master .switch {
      position: relative; width: 38px; height: 22px; border-radius: 999px;
      background: var(--line-strong); flex: 0 0 auto; transition: background .15s;
    }
    .master.on .switch { background: var(--nice-blue); }
    .master .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%; background: var(--surface);
      transition: transform .15s;
    }
    .master.on .switch::after { transform: translateX(16px); }
    .master .txt { font-size: 13.5px; font-weight: 600; }
    .master .sub { font-size: 11.5px; color: var(--soft); font-weight: 400; display: block; margin-top: 1px; }
    .master input { display: none; }

    .row { margin: 10px 0; }
    label.lbl { display: block; font-size: 11px; color: var(--soft); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
    select { width: 100%; padding: 7px 8px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 13px; }
    select:focus { outline: none; border-color: var(--nice-blue); }
    .hint { font-size: 12px; color: var(--soft); line-height: 1.5; }
    .mapped { font-size: 12.5px; background: var(--surface-3); border-radius: 8px; padding: 8px 10px; line-height: 1.5; }
    .mapped b { color: var(--nice-blue); }
    .footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .footer a { font-size: 12px; color: var(--nice-blue); text-decoration: none; cursor: pointer; }
    #version { font-size: 11px; color: var(--faint); }
    .disabled { opacity: .45; pointer-events: none; }
  </style>
</head>
<body>
  <h1><span class="brand" role="img" aria-label="NiCE Cognigy"></span><span class="sub">Demo Studio</span><span class="dot" id="statusDot"></span></h1>
  <div class="wrap">

    <label class="master" id="masterToggle">
      <input type="checkbox" id="enabled" />
      <span class="switch"></span>
      <span class="txt">Show demos<span class="sub" id="masterSub">Off — nothing is injected on any site</span></span>
    </label>

    <div id="connected" style="display:none">
      <div class="row mapped" id="mapped"></div>
      <div class="row">
        <label class="lbl" for="override">Demo on this browser</label>
        <select id="override"><option value="">Auto (match by website)</option></select>
      </div>
    </div>

    <div class="hint" id="statusText">Checking…</div>

    <div class="footer">
      <a id="openStudio">Open Demo Studio</a>
      <span id="version"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
