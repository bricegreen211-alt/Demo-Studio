<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Experience</title>
  <!--
    Studio-owned host page for the real Cognigy Webchat v3 widget. Served by
    the service (see server.js sendWebchat3Host) instead of the demo's own
    build when demo.json says chatUi: "webchat3".

    Served from the service rather than built into the templates on purpose:
    a demo folder holds its own copy of the template source, so a built-in
    version would only ever reach demos created after the change. This way
    every demo — old, new, or vibe-coded — can switch to Webchat v3 with no
    rebuild and no template Sync. Same reasoning as clear-mode.css.

    Absolute /_cds/ paths are deliberate: this page is served at /<slug>/ on
    the same origin (unlike the demo builds, which use a relative base).
  -->
  <link rel="stylesheet" href="/_cds/webchat3.css" />
</head>
<body>
  <!-- Shown only if the widget can't start; a silent blank panel would break
       the "a wrong endpoint still fails loudly" rule. -->
  <div id="cds-fallback" hidden>
    <div class="cds-fallback-card">
      <h1>Demo Experience</h1>
      <p id="cds-fallback-msg"></p>
      <p class="cds-fallback-hint">Fix this in Cognigy Demo Studio, then reload.</p>
    </div>
  </div>
  <!--CDS_CONFIG-->
  <script src="/_cds/webchat.js"></script>
  <script src="/_cds/webchat3.js"></script>
</body>
</html>
